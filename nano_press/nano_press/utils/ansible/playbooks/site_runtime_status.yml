- hosts: all
  become: true
  vars:
    repo_dir: "/home/{{ bench_name }}/"
    compose_file: "pwd.yml"
    project_name: "{{ bench_name | regex_replace('[^a-zA-Z0-9_-]', '_') | lower }}"
    core_services_regex: "^(backend|frontend|websocket|scheduler|queue-long|queue-short|db|redis-queue|redis-cache)$"
  tasks:
    - name: Check if compose file exists
      ansible.builtin.stat:
        path: "{{ repo_dir }}/{{ compose_file }}"
      register: compose_file_stat

    - name: Collect site runtime status
      ansible.builtin.shell: |
        set -e
        if [ ! -f "{{ repo_dir }}/{{ compose_file }}" ]; then
          echo '{"exists":0,"running":0,"containers_running":0,"http_ok":0,"app_ready":0,"current_image":""}'
          exit 0
        fi

        running_services="$(docker compose -p {{ project_name }} -f {{ compose_file }} ps --status running --services 2>/dev/null | sed '/^$/d' || true)"
        running_count=$(echo "$running_services" | grep -E '{{ core_services_regex }}' | sed '/^$/d' | wc -l)
        current_image=""

        backend_container_id="$(docker compose -p {{ project_name }} -f {{ compose_file }} ps -q backend 2>/dev/null | head -n1 || true)"
        if [ -n "$backend_container_id" ]; then
          current_image="$(docker inspect --format '{{ '{{' }}.Config.Image{{ '}}' }}' "$backend_container_id" 2>/dev/null || true)"
        fi

        if [ -z "$current_image" ]; then
          frontend_container_id="$(docker compose -p {{ project_name }} -f {{ compose_file }} ps -q frontend 2>/dev/null | head -n1 || true)"
          if [ -n "$frontend_container_id" ]; then
            current_image="$(docker inspect --format '{{ '{{' }}.Config.Image{{ '}}' }}' "$frontend_container_id" 2>/dev/null || true)"
          fi
        fi

        http_ok=0
        app_ready=0

        if [ "$running_count" -gt 0 ]; then
          running=1
        else
          running=0
        fi

        echo "{\"exists\":1,\"running\":$running,\"containers_running\":$running_count,\"http_ok\":$http_ok,\"app_ready\":$app_ready,\"current_image\":\"$current_image\"}"
      args:
        chdir: "{{ repo_dir }}"
        executable: /bin/bash
      register: runtime_status
      changed_when: false

    - name: Emit runtime status
      ansible.builtin.debug:
        msg: "{{ runtime_status.stdout }}"

- name: Probe app operation status (attempt {{ app_operation_poll_attempt }}/240)
  ansible.builtin.shell: |
    set -e
    done=0
    ok=0
    status="running"

    if [ -f "{{ app_op_rc_file }}" ]; then
      done=1
      rc="$(tail -n1 "{{ app_op_rc_file }}" 2>/dev/null || echo 1)"
      if [ "$rc" = "0" ]; then
        ok=1
      fi
      status="finished"
    elif [ -f "{{ app_op_pid_file }}" ]; then
      pid="$(cat "{{ app_op_pid_file }}" 2>/dev/null || echo '')"
      if [ -n "$pid" ] && ps -p "$pid" >/dev/null 2>&1; then
        status="running"
      else
        status="exited_without_rc"
        done=1
        ok=0
      fi
    else
      status="missing_pid"
      done=1
      ok=0
    fi

    echo "done=$done"
    echo "ok=$ok"
    echo "status=$status"
    echo "log_start"
    tail -n 80 "{{ app_op_log_file }}" 2>/dev/null || true
    echo "log_end"

    if [ "$done" = "1" ] && [ "$ok" != "1" ]; then
      echo "App operation failed. See log above." >&2
      exit 1
    fi
  args:
    chdir: "{{ repo_dir }}"
    executable: /bin/bash
  register: app_operation_probe
  changed_when: false

- name: Show live app operation logs
  ansible.builtin.debug:
    msg: "{{ app_operation_probe.stdout }}"

- name: Mark app operation completion
  ansible.builtin.set_fact:
    app_operation_done: "{{ app_operation_probe.stdout is search('done=1') }}"

- name: Pause before next app operation probe
  ansible.builtin.pause:
    seconds: 5
  when: not (app_operation_done | default(false))

- name: Fail if app operation exceeds wait window
  ansible.builtin.fail:
    msg: "Timed out waiting for app operation to complete after 240 attempts."
  when:
    - app_operation_poll_attempt | int >= 240
    - not (app_operation_done | default(false))

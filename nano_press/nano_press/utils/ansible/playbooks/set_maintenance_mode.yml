- hosts: all
  become: true
  vars:
    repo_dir: "/home/{{ bench_name }}/"
    compose_file: "pwd.yml"
    project_name: "{{ bench_name | regex_replace('[^a-zA-Z0-9_-]', '_') | lower }}"
  tasks:
    - name: Ensure compose file exists
      ansible.builtin.stat:
        path: "{{ repo_dir }}/{{ compose_file }}"
      register: compose_file_stat

    - name: Fail if compose file is missing
      ansible.builtin.fail:
        msg: "Compose file {{ repo_dir }}/{{ compose_file }} not found"
      when: not compose_file_stat.stat.exists

    - name: Ensure backend container is running
      ansible.builtin.shell: |
        set -e
        docker compose -p {{ project_name }} -f {{ compose_file }} ps --status running --services | grep -Fx backend
      args:
        chdir: "{{ repo_dir }}"
        executable: /bin/bash
      changed_when: false

    - name: Toggle maintenance mode inside backend container
      ansible.builtin.shell: |
        set -e
        if [ "{{ maintenance_mode }}" = "on" ]; then
          docker compose -p {{ project_name }} -f {{ compose_file }} exec -T backend bash -lc "bench --site {{ site_name | quote }} set-config maintenance_mode_message {{ maintenance_message | quote }} && bench --site {{ site_name | quote }} set-maintenance-mode on"
        else
          docker compose -p {{ project_name }} -f {{ compose_file }} exec -T backend bash -lc "bench --site {{ site_name | quote }} set-maintenance-mode off"
        fi
      args:
        chdir: "{{ repo_dir }}"
        executable: /bin/bash
      changed_when: true

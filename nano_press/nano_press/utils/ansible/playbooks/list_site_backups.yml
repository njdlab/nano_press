- hosts: all
  become: true
  vars:
    backup_root_dir: "{{ backup_root_dir | default('/home/' ~ bench_name ~ '/Backups') }}"
  tasks:
    - name: Collect remote backup catalog
      ansible.builtin.shell: |
        set -e
        python3 - <<'PY'
        import json
        import os

        root = os.path.join({{ backup_root_dir | to_json }}, {{ site_name | default('frontend') | to_json }})
        backups = []
        if os.path.isdir(root):
          for entry in sorted(os.listdir(root), reverse=True):
            directory = os.path.join(root, entry)
            if not os.path.isdir(directory):
              continue
            files = []
            for file_name in sorted(os.listdir(directory)):
              file_path = os.path.join(directory, file_name)
              if os.path.isfile(file_path):
                files.append(file_name)
            if not files:
              continue
            backups.append({
              "label": entry,
              "directory": directory,
              "files": files,
            })

        print(json.dumps({
          "root_directory": root,
          "backups": backups,
        }))
        PY
      args:
        executable: /bin/bash
      register: backup_catalog
      changed_when: false
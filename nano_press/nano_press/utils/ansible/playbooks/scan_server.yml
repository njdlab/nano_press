- hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Scan Docker state for recovery wizard
      ansible.builtin.shell: |
        python3 - << 'PYEOF'
        import json
        import os
        import re
        import subprocess

        manifest_dir = "/var/lib/nano_press/recovery/custom_images"
        manifests_by_tag = {}

        if os.path.isdir(manifest_dir):
            try:
                for filename in os.listdir(manifest_dir):
                    if not filename.endswith(".json"):
                        continue

                    path = os.path.join(manifest_dir, filename)
                    try:
                        with open(path, encoding="utf-8") as f:
                            manifest = json.load(f)
                        if not isinstance(manifest, dict):
                            continue
                        image_tag = (manifest.get("image_tag") or "").strip()
                        if not image_tag:
                            continue
                        manifests_by_tag[image_tag] = manifest
                    except Exception:
                        continue
            except Exception:
                pass

        images = []

        def go_field(field: str) -> str:
            # Build Go-template tokens at runtime to avoid Ansible/Jinja rendering.
            return "{" + "{" + "." + field + "}" + "}"

        try:
            fmt = (
                '{"repo":"%s","tag":"%s","id":"%s","size":"%s","created":"%s"}'
                % (
                    go_field("Repository"),
                    go_field("Tag"),
                    go_field("ID"),
                    go_field("Size"),
                    go_field("CreatedAt"),
                )
            )
            r = subprocess.run(
                ["docker", "images", "--format", fmt],
                capture_output=True,
                text=True,
                timeout=30,
            )
            skip_prefixes = ("traefik", "mariadb", "redis", "<none>", "nginx", "ghcr.io/frappe")
            for line in (r.stdout or "").splitlines():
                line = line.strip()
                if not line:
                    continue
                try:
                    img = json.loads(line)
                except Exception:
                    continue

                repo = (img.get("repo") or "").strip()
                if not repo or any(repo.startswith(p) for p in skip_prefixes):
                    continue

                tag = (img.get("tag") or "").strip()
                img["image_tag"] = f"{repo}:{tag}" if tag else repo
                manifest = manifests_by_tag.get(img["image_tag"])
                if isinstance(manifest, dict):
                    img["manifest_found"] = True
                    img["recovery_manifest"] = manifest
                    img["apps_config"] = manifest.get("apps_config", [])
                else:
                    img["manifest_found"] = False
                images.append(img)
        except Exception:
            pass

        stacks = []
        try:
            r = subprocess.run(
                ["docker", "compose", "ls", "--all", "--format", "json"],
                capture_output=True,
                text=True,
                timeout=30,
            )
            raw = (r.stdout or "").strip()
            if raw:
                if raw.startswith("["):
                    stacks = json.loads(raw)
                else:
                    for ln in raw.splitlines():
                        ln = ln.strip()
                        if not ln:
                            continue
                        try:
                            stacks.append(json.loads(ln))
                        except Exception:
                            pass
        except Exception:
            pass

        sites = []
        for stack in stacks:
            name = (stack.get("Name") or "").strip()
            config_files = (stack.get("ConfigFiles") or "").strip()
            status = (stack.get("Status") or "").strip()
            if not config_files:
                continue

            config_file = config_files.split(",")[0].strip()
            bench_dir = os.path.dirname(config_file)
            env_file = os.path.join(bench_dir, ".env")
            if not os.path.exists(env_file):
                continue

            env = {}
            try:
                with open(env_file, encoding="utf-8") as f:
                    for line in f:
                        line = line.strip()
                        if not line or line.startswith("#") or "=" not in line:
                            continue
                        k, _, v = line.partition("=")
                        env[k.strip()] = v.strip()
            except Exception:
                continue

            docker_image = ""
            try:
                with open(config_file, encoding="utf-8") as f:
                    for line in f:
                        m = re.match(r"^\s*image:\s*(\S+)", line)
                        if m:
                            docker_image = m.group(1)
                            break
            except Exception:
                pass

            site_url = (env.get("SITES") or "").strip("`'\"")
            sites.append(
                {
                    "bench_name": name,
                    "bench_dir": bench_dir,
                    "stack_status": status,
                    "site_url": site_url,
                    "docker_image": docker_image,
                    "admin_password": env.get("ADMIN_PASSWORD", ""),
                    "db_username": env.get("DB_ROOT_USERNAME", "root"),
                    "db_password": env.get("DB_PASSWORD", ""),
                    "install_apps": env.get("INSTALL_APPS", ""),
                }
            )

        print(json.dumps({"images": images, "sites": sites}))
        PYEOF
      args:
        executable: /bin/bash
      register: scan_result
      changed_when: false

    - name: Emit scan results
      ansible.builtin.debug:
        msg: "{{ scan_result.stdout }}"

---
- name: Collect server resource metrics
  hosts: all
  gather_facts: false
  become: false

  tasks:
    - name: Collect server metrics
      ansible.builtin.shell: |
        set -e

        cpu_line_1=$(grep '^cpu ' /proc/stat)
        sleep 1
        cpu_line_2=$(grep '^cpu ' /proc/stat)

        cpu_idle_1=$(echo "$cpu_line_1" | awk '{print $5}')
        cpu_total_1=$(echo "$cpu_line_1" | awk '{total=0; for (i=2; i<=NF; i++) total+=$i; print total}')
        cpu_idle_2=$(echo "$cpu_line_2" | awk '{print $5}')
        cpu_total_2=$(echo "$cpu_line_2" | awk '{total=0; for (i=2; i<=NF; i++) total+=$i; print total}')

        cpu_total_delta=$((cpu_total_2 - cpu_total_1))
        cpu_idle_delta=$((cpu_idle_2 - cpu_idle_1))

        if [ "$cpu_total_delta" -gt 0 ]; then
          cpu_percent=$(awk -v total="$cpu_total_delta" -v idle="$cpu_idle_delta" 'BEGIN { printf "%.2f", ((total-idle)/total)*100 }')
        else
          cpu_percent="0.00"
        fi

        mem_total_kb=$(awk '/MemTotal:/ {print $2}' /proc/meminfo)
        mem_available_kb=$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)

        if [ -z "$mem_available_kb" ]; then
          mem_available_kb=$(awk '/MemFree:/ {print $2}' /proc/meminfo)
        fi

        mem_used_kb=$((mem_total_kb - mem_available_kb))
        ram_percent=$(awk -v total="$mem_total_kb" -v used="$mem_used_kb" 'BEGIN { if (total > 0) printf "%.2f", (used/total)*100; else printf "0.00" }')

        disk_total_kb=$(df -Pk / | awk 'NR==2 {print $2}')
        disk_used_kb=$(df -Pk / | awk 'NR==2 {print $3}')
        disk_percent=$(awk -v total="$disk_total_kb" -v used="$disk_used_kb" 'BEGIN { if (total > 0) printf "%.2f", (used/total)*100; else printf "0.00" }')

        load_1m=$(awk '{print $1}' /proc/loadavg)

        ram_total_gb=$(awk -v kb="$mem_total_kb" 'BEGIN { printf "%.2f", kb/1024/1024 }')
        ram_used_gb=$(awk -v kb="$mem_used_kb" 'BEGIN { printf "%.2f", kb/1024/1024 }')
        disk_total_gb=$(awk -v kb="$disk_total_kb" 'BEGIN { printf "%.2f", kb/1024/1024 }')
        disk_used_gb=$(awk -v kb="$disk_used_kb" 'BEGIN { printf "%.2f", kb/1024/1024 }')

        echo "cpu_percent=$cpu_percent"
        echo "ram_percent=$ram_percent"
        echo "disk_percent=$disk_percent"
        echo "load_1m=$load_1m"
        echo "ram_total_gb=$ram_total_gb"
        echo "ram_used_gb=$ram_used_gb"
        echo "disk_total_gb=$disk_total_gb"
        echo "disk_used_gb=$disk_used_gb"
      args:
        executable: /bin/bash
      register: server_metrics
      changed_when: false

    - name: Print collected server metrics
      ansible.builtin.debug:
        msg: "{{ server_metrics.stdout }}"

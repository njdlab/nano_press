- name: Probe backup operation status (attempt {{ backup_operation_poll_attempt }}/240)
  ansible.builtin.shell: |
    set -e
    done=0
    ok=0
    status="running"

    if [ -f "{{ backup_op_rc_file }}" ]; then
      done=1
      rc="$(tail -n1 "{{ backup_op_rc_file }}" 2>/dev/null || echo 1)"
      if [ "$rc" = "0" ]; then
        ok=1
      fi
      status="finished"
    elif [ -f "{{ backup_op_pid_file }}" ]; then
      pid="$(cat "{{ backup_op_pid_file }}" 2>/dev/null || echo '')"
      if [ -n "$pid" ] && ps -p "$pid" >/dev/null 2>&1; then
        status="running"
      else
        status="exited_without_rc"
        done=1
        ok=0
      fi
    else
      # PID can disappear on short-lived jobs; fall back to parsing terminal rc from log.
      if [ -f "{{ backup_op_log_file }}" ]; then
        final_line="$(grep -E '\[nano_press\] finished_at=.* rc=[0-9]+' "{{ backup_op_log_file }}" | tail -n1 || true)"
        if [ -n "$final_line" ]; then
          parsed_rc="$(echo "$final_line" | sed -n 's/.* rc=\([0-9][0-9]*\).*/\1/p' | tail -n1)"
          if [ -n "$parsed_rc" ]; then
            done=1
            if [ "$parsed_rc" = "0" ]; then
              ok=1
              status="finished"
            else
              ok=0
              status="finished"
            fi
          else
            status="missing_pid"
            done=1
            ok=0
          fi
        else
          status="missing_pid"
          done=1
          ok=0
        fi
      else
        status="missing_pid"
        done=1
        ok=0
      fi
    fi

    echo "done=$done"
    echo "ok=$ok"
    echo "status=$status"
    echo "log_start"
    tail -n 100 "{{ backup_op_log_file }}" 2>/dev/null || true
    echo "log_end"

    if [ "$done" = "1" ] && [ "$ok" != "1" ]; then
      echo "Backup operation failed. See log above." >&2
      exit 1
    fi
  args:
    chdir: "{{ repo_dir }}"
    executable: /bin/bash
  register: backup_operation_probe
  changed_when: false

- name: Show live backup operation logs
  ansible.builtin.debug:
    msg: "{{ backup_operation_probe.stdout }}"

- name: Mark backup operation completion
  ansible.builtin.set_fact:
    backup_operation_done: "{{ backup_operation_probe.stdout is search('done=1') }}"

- name: Pause before next backup operation probe
  ansible.builtin.pause:
    seconds: 5
  when: not (backup_operation_done | default(false))

- name: Fail if backup operation exceeds wait window
  ansible.builtin.fail:
    msg: "Timed out waiting for backup operation to complete after 240 attempts."
  when:
    - backup_operation_poll_attempt | int >= 240
    - not (backup_operation_done | default(false))

- hosts: all
  become: true
  vars:
    repo_dir: "/home/{{ bench_name }}/"
    compose_file: "pwd.yml"
    project_name: "{{ bench_name | regex_replace('[^a-zA-Z0-9_-]', '_') | lower }}"
    force_redeploy: "{{ force_redeploy | default(0) }}"
  tasks:

    - name: Ensure compose file exists
      ansible.builtin.stat:
        path: "{{ repo_dir }}/{{ compose_file }}"
      register: compose_file_stat

    - name: Fail if compose file is missing
      ansible.builtin.fail:
        msg: "Compose file {{ repo_dir }}/{{ compose_file }} not found"
      when: not compose_file_stat.stat.exists

    - name: Pre-clean conflicting app assets in sites volume
      ansible.builtin.shell: |
        set -e

        env_file="{{ repo_dir }}/.env"
        if [ ! -f "$env_file" ]; then
          exit 0
        fi

        apps_csv="$(sed -n 's/^INSTALL_APPS=//p' "$env_file" | tail -n1)"
        apps_csv="${apps_csv//\`/}"
        apps_csv="${apps_csv//\"/}"
        apps_csv="${apps_csv//\'/}"

        # No default app forced; empty means frappe-only bootstrap

        volume_name="{{ project_name }}_sites"
        mountpoint="$(docker volume inspect -f '{{"{{"}}.Mountpoint{{"}}"}}' "$volume_name" 2>/dev/null || true)"

        if [ -z "$mountpoint" ] || [ ! -d "$mountpoint" ]; then
          exit 0
        fi

        # Only clean up conflicting paths if assets/ already exists (i.e. a redeploy).
        # Do NOT create assets/ here — Docker manages it during first compose up.
        if [ ! -d "$mountpoint/assets" ]; then
          exit 0
        fi

        for app in $(echo "$apps_csv" | tr ',' ' '); do
          [ -z "$app" ] && continue
          target="$mountpoint/assets/$app"

          # Docker fails when bootstrapping symlinked app assets if a non-symlink path already exists.
          if [ -e "$target" ] && [ ! -L "$target" ]; then
            rm -rf "$target"
            echo "Removed conflicting asset path: $target"
          fi
        done
      args:
        chdir: "{{ repo_dir }}"
        executable: /bin/bash
      changed_when: false

    - name: Run docker compose up (standard)
      ansible.builtin.shell: |
        set -e
        docker compose -p {{ project_name }} -f {{ compose_file }} up -d --quiet-pull
      args:
        chdir: "{{ repo_dir }}"
        executable: /bin/bash
      when: force_redeploy | int != 1

    - name: Run docker compose up (force redeploy)
      ansible.builtin.shell: |
        set -e
        docker compose -p {{ project_name }} -f {{ compose_file }} up -d --quiet-pull --force-recreate --remove-orphans
      args:
        chdir: "{{ repo_dir }}"
        executable: /bin/bash
      when: force_redeploy | int == 1

    - name: Verify compose has running services after deploy
      ansible.builtin.shell: |
        set -e
        running_count="$(docker compose -p {{ project_name }} -f {{ compose_file }} ps --status running --services | sed '/^$/d' | wc -l)"
        if [ "$running_count" -gt 0 ]; then
          echo "Running containers: $running_count"
          exit 0
        fi

        echo "No running containers after compose up -d" >&2
        echo "--- docker compose ps -a ---" >&2
        docker compose -p {{ project_name }} -f {{ compose_file }} ps -a >&2 || true
        echo "--- docker compose logs --tail=80 ---" >&2
        docker compose -p {{ project_name }} -f {{ compose_file }} logs --tail=80 >&2 || true
        exit 1
      args:
        chdir: "{{ repo_dir }}"
        executable: /bin/bash
      register: compose_deploy_verify
      changed_when: false

    - name: Wait for create-site app installation to finish
      ansible.builtin.shell: |
        set -e

        for install_poll_attempt in $(seq 1 120); do
          container_id="$(docker compose -p {{ project_name }} -f {{ compose_file }} ps -a -q create-site 2>/dev/null | head -n1)"

          if [ -z "$container_id" ]; then
            echo "create-site container missing; assuming apps are already installed"
            exit 0
          fi

          container_status="$(docker inspect -f '{{"{{"}}.State.Status{{"}}"}}' "$container_id" 2>/dev/null || echo unknown)"
          container_exit_code="$(docker inspect -f '{{"{{"}}.State.ExitCode{{"}}"}}' "$container_id" 2>/dev/null || echo unknown)"

          echo "Probe create-site container status (attempt ${install_poll_attempt}/120): status=${container_status} exit_code=${container_exit_code}"
          docker logs --tail=40 "$container_id" 2>&1 || true

          if [ "$container_status" = "running" ] || [ "$container_status" = "created" ] || [ "$container_status" = "restarting" ]; then
            sleep 5
            continue
          fi

          if [ "$container_status" = "exited" ] && [ "$container_exit_code" = "0" ]; then
            echo "create-site installation completed successfully"
            exit 0
          fi

          echo "create-site exited with status=${container_status} code=${container_exit_code}" >&2
          exit 1
        done

        echo "Timed out waiting for create-site app installation to complete after 120 attempts." >&2
        exit 1
      args:
        chdir: "{{ repo_dir }}"
        executable: /bin/bash
      register: create_site_install_wait
      changed_when: false


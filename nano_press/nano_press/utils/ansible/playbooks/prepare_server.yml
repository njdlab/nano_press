- hosts: all
  become: true
  vars:
    traefik_dir: "/opt/traefik"
  tasks:
    # =============================================
    # STEP 1: Clean up any APT conflicts
    # =============================================
    - name: Clean up Docker APT conflicts (if any)
      block:
        - name: Remove conflicting Docker APT sources
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apt/sources.list.d/docker.list
            - /etc/apt/sources.list.d/docker-ce.list
          ignore_errors: true

        - name: Remove conflicting Docker keyrings
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/apt/keyrings/docker.asc
            - /etc/apt/keyrings/docker.gpg
            - /usr/share/keyrings/docker-archive-keyring.gpg
          ignore_errors: true

        - name: Force APT cache update
          ansible.builtin.shell: |
            rm -rf /var/lib/apt/lists/* || true
            apt-get clean || true
            apt-get update --fix-missing --allow-releaseinfo-change || apt-get update --fix-missing || apt-get update
          changed_when: false
          register: apt_update
          retries: 3
          delay: 5
          until: apt_update.rc == 0

    # =============================================
    # STEP 2: Check if Docker is already installed
    # =============================================
    - name: Check if Docker is already installed
      ansible.builtin.command: docker --version
      register: docker_check
      failed_when: false
      changed_when: false

    - name: Display Docker status
      ansible.builtin.debug:
        msg: "Docker is already installed: {{ docker_check.stdout }}"
      when: docker_check.rc == 0

    # =============================================
    # STEP 3: Install Docker (only if not present)
    # =============================================
    - name: Install Docker
      block:
        - name: Initialize unattended-upgrades wait state
          ansible.builtin.set_fact:
            unattended_upgrades_done: false

        - name: Wait for unattended-upgrades to finish
          ansible.builtin.include_tasks: partials/wait_for_unattended_upgrades_poll.yml
          loop: "{{ range(1, 61) | list }}"
          loop_control:
            loop_var: unattended_upgrade_attempt
            label: "poll {{ unattended_upgrade_attempt }}/60"
          when: not unattended_upgrades_done

        - name: Wait for apt/dpkg locks to be released
          ansible.builtin.shell: |
            for i in $(seq 1 30); do
              if ! fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock >/dev/null 2>&1; then
                exit 0
              fi
              echo "Waiting for apt lock... attempt $i/30"
              sleep 10
            done
            echo "Timed out waiting for apt lock"
            exit 1
          changed_when: false

        - name: Update apt cache before installing prerequisites
          ansible.builtin.shell: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update --allow-releaseinfo-change --fix-missing
          changed_when: false

        - name: Ensure Docker prerequisites are installed
          ansible.builtin.apt:
            name:
              - apt-transport-https
              - ca-certificates
              - curl
              - gnupg
              - lsb-release
            state: present
            update_cache: no
            force_apt_get: yes
            cache_valid_time: 3600

        - name: Install Docker via convenience script
          ansible.builtin.shell: curl -fsSL https://get.docker.com | bash
          args:
            executable: /bin/bash

        - name: Reload systemd daemon after Docker install
          ansible.builtin.systemd:
            daemon_reload: yes
          when: ansible_service_mgr == 'systemd'

        - name: Check if docker systemd unit exists
          ansible.builtin.command: systemctl list-unit-files docker.service
          register: docker_unit_check
          changed_when: false
          failed_when: false
          when: ansible_service_mgr == 'systemd'

        - name: Ensure Docker service is running (systemd)
          block:
            - name: Start and enable docker service
              ansible.builtin.systemd:
                name: docker
                state: started
                enabled: true
          rescue:
            - name: Fallback start via service command
              ansible.builtin.command: service docker start
              register: docker_service_fallback
              changed_when: docker_service_fallback.rc == 0
              failed_when: false
          when:
            - ansible_service_mgr == 'systemd'
            - docker_unit_check.rc == 0

        - name: Verify Docker daemon is reachable
          ansible.builtin.command: docker info
          register: docker_info_check
          retries: 5
          delay: 3
          until: docker_info_check.rc == 0
          changed_when: false

        - name: Add user to docker group
          ansible.builtin.user:
            name: "{{ ansible_user }}"
            groups: docker
            append: true
      when: docker_check.rc != 0

    # =============================================
    # STEP 4: Get Docker version
    # =============================================
    - name: Get Docker version
      ansible.builtin.command: docker --version
      register: docker_version_output
      changed_when: false

    # =============================================
    # STEP 5: Check if Docker Compose is available
    # =============================================
    - name: Check if Docker Compose is available
      ansible.builtin.command: docker compose version
      register: compose_check
      failed_when: false
      changed_when: false

    - name: Display Docker Compose status
      ansible.builtin.debug:
        msg: "Docker Compose is already available: {{ compose_check.stdout }}"
      when: compose_check.rc == 0

    # =============================================
    # STEP 6: Install Docker Compose (only if not present)
    # =============================================
    - name: Install Compose v2 binary
      ansible.builtin.shell: |
        DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
        mkdir -p $DOCKER_CONFIG/cli-plugins
        curl -SL https://github.com/docker/compose/releases/download/{{ compose_v2_version | default('v2.24.5') }}/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
        chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
      args:
        executable: /bin/bash
      when: compose_check.rc != 0

    # =============================================
    # STEP 7: Get Docker Compose version
    # =============================================
    - name: Get Docker Compose version
      ansible.builtin.command: docker compose version
      register: compose_version_output
      changed_when: false

    # =============================================
    # STEP 8: Check if Traefik is already deployed
    # =============================================
    - name: Check if Traefik is already running
      ansible.builtin.shell: docker ps --filter "name=traefik" -q
      register: traefik_check
      changed_when: false
      failed_when: false

    - name: Display Traefik status
      ansible.builtin.debug:
        msg: "Traefik is already deployed"
      when: traefik_check.stdout | length > 0

    # =============================================
    # STEP 9: Deploy Traefik (only if not present)
    # =============================================
    - name: Deploy Traefik
      block:
        - name: Ensure Traefik directory exists
          ansible.builtin.file:
            path: "{{ traefik_dir }}"
            state: directory
            mode: '0755'

        - name: Create traefik-public network
          ansible.builtin.shell: docker network create traefik-public || true
          changed_when: false
          ignore_errors: true

        - name: Check if openssl is installed
          ansible.builtin.command: which openssl
          register: openssl_check
          failed_when: false
          changed_when: false

        - name: Install openssl if not present
          ansible.builtin.shell: |
            apt-get install -y openssl || true
          when: openssl_check.rc != 0
          ignore_errors: true

        - name: Generate password hash for Traefik admin
          block:
            - name: Try openssl method first
              ansible.builtin.shell: |
                set -e
                PASS={{ traefik_password }}
                openssl passwd -apr1 "$PASS"
              register: openssl_out
              failed_when: false
              changed_when: false
              args:
                executable: /bin/bash

            - name: Fallback to Python method if openssl fails
              ansible.builtin.shell: |
                python3 -c "
                import crypt
                import string
                import secrets
                password = '{{ traefik_password }}'
                salt = '$apr1$' + ''.join(secrets.choice(string.ascii_letters + string.digits + './') for _ in range(8)) + '$'
                hash_result = crypt.crypt(password, salt)
                print(hash_result)
                "
              register: python_out
              when: openssl_out.rc != 0
              changed_when: false
              args:
                executable: /bin/bash

            - name: Set password hash from successful method
              ansible.builtin.set_fact:
                password_hash: "{{ openssl_out.stdout if openssl_out.rc == 0 else python_out.stdout }}"

        - name: Set password hash variable (escape $ for docker-compose)
          ansible.builtin.set_fact:
            traefik_password_hash: "{{ password_hash | trim | replace('$', '$$') }}"

        - name: Create Traefik docker-compose.yml
          ansible.builtin.template:
            src: ../templates/traefik.yml.j2
            dest: "{{ traefik_dir }}/docker-compose.yml"
            mode: '0644'

        - name: Check Docker Hub DNS resolution
          ansible.builtin.command: getent hosts auth.docker.io
          register: dockerhub_dns_check
          changed_when: false
          failed_when: false
          retries: 5
          delay: 5
          until: dockerhub_dns_check.rc == 0

        - name: Check Docker Hub token endpoint reachability
          ansible.builtin.shell: |
            curl -fsS --max-time 15 "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/traefik:pull" >/dev/null
          register: dockerhub_https_check
          changed_when: false
          failed_when: false
          retries: 5
          delay: 5
          until: dockerhub_https_check.rc == 0
          args:
            executable: /bin/bash

        - name: Fail if Docker Hub is not reachable
          ansible.builtin.fail:
            msg: >-
              Cannot reach Docker Hub from target host. DNS or outbound connectivity is failing.
              DNS check rc={{ dockerhub_dns_check.rc }}, HTTPS check rc={{ dockerhub_https_check.rc }}.
              Verify resolver/network on target for auth.docker.io and registry-1.docker.io and allow outbound 443.
          when: dockerhub_dns_check.rc != 0 or dockerhub_https_check.rc != 0

        - name: Start Traefik container
          ansible.builtin.shell: |
            cd {{ traefik_dir }}
            docker compose up -d
          args:
            executable: /bin/bash

        - name: Wait for Traefik to be ready
          ansible.builtin.wait_for:
            host: "{{ traefik_domain }}"
            port: 443
            timeout: 60
          ignore_errors: true

        - name: Get Traefik version
          ansible.builtin.shell: docker exec traefik traefik version | head -n1 || echo "v2.11"
          register: traefik_version_check
          changed_when: false
          failed_when: false
      when: traefik_check.stdout | length == 0 and traefik_domain is defined

    # =============================================
    # STEP 10: Display summary
    # =============================================
    - name: Display installation summary
      ansible.builtin.debug:
        msg:
          - "========================================="
          - "Server Preparation Complete!"
          - "========================================="
          - "Docker Version: {{ docker_version_output.stdout }}"
          - "Docker Compose Version: {{ compose_version_output.stdout }}"
          - "Traefik Status: {{ 'Deployed' if traefik_check.stdout | length == 0 and traefik_domain is defined else 'Skipped or Already Running' }}"
          - "========================================="

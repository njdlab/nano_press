- hosts: all
  become: true
  vars:
    repo_dir: "/home/{{ bench_name }}/"
    compose_file: "pwd.yml"
    project_name: "{{ bench_name | regex_replace('[^a-zA-Z0-9_-]', '_') | lower }}"
  tasks:
    - name: Ensure compose file exists
      ansible.builtin.stat:
        path: "{{ repo_dir }}/{{ compose_file }}"
      register: compose_file_stat

    - name: Fail if compose file is missing
      ansible.builtin.fail:
        msg: "Compose file {{ repo_dir }}/{{ compose_file }} not found"
      when: not compose_file_stat.stat.exists

    - name: Ensure backend container is running
      ansible.builtin.shell: |
        set -e
        docker compose -p {{ project_name }} -f {{ compose_file }} ps --status running --services | grep -Fx backend
      args:
        chdir: "{{ repo_dir }}"
        executable: /bin/bash
      register: backend_running
      changed_when: false

    - name: Reset Administrator password inside backend container
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -p
          - "{{ project_name }}"
          - -f
          - "{{ compose_file }}"
          - exec
          - -T
          - backend
          - bash
          - -lc
          - "bench --site {{ site_name | quote }} set-admin-password {{ admin_password | quote }}"
      args:
        chdir: "{{ repo_dir }}"
      changed_when: true

- hosts: all
  become: true
  gather_facts: true

  vars:
    build_dir: "/tmp/custom_image_builds"
    frappe_docker_dir: "/tmp/frappe_docker"
    build_env_path: "{{ build_dir }}/build.env"
    default_frappe_app: "https://github.com/frappe/frappe"
    apps_json_base64: "{{ apps_json_base64 | default(omit) }}"
    image_name: "{{ image_name }}"
    # frappe_path: "{{ frappe_path | default(default_frappe_app) }}"
    frappe_version: "{{ frappe_version | default('version-15') }}"
    recovery_manifest: "{{ recovery_manifest | default({}) }}"
    recovery_manifest_dir: "/var/lib/nano_press/recovery/custom_images"
    recovery_manifest_file: "{{ recovery_manifest_dir }}/{{ (image_tag | default(image_name)) | regex_replace('[^a-zA-Z0-9_.-]', '_') }}.json"
    cleanup_tmp_files: true
    force_build: true
    build_log_path: "{{ build_dir }}/{{ image_name | regex_replace('/', '_') }}.build.log"

  pre_tasks:
    - name: Ensure build directory exists
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure recovery manifest directory exists
      ansible.builtin.file:
        path: "{{ recovery_manifest_dir }}"
        state: directory
        mode: "0755"

  tasks:
    - name: Check docker daemon is available
      ansible.builtin.command: docker info
      register: docker_info
      failed_when: docker_info.rc != 0
      changed_when: false

    - name: Clone or update frappe_docker repo
      ansible.builtin.git:
        repo: "https://github.com/frappe/frappe_docker"
        dest: "{{ frappe_docker_dir }}"
        update: yes
        force: yes
        accept_hostkey: yes

    - name: Ensure apps_json_base64 is provided
      ansible.builtin.assert:
        that:
          - apps_json_base64 is defined
          - apps_json_base64 | length > 0
        fail_msg: "You must supply 'apps_json_base64' (base64 encoded apps.json)."

    - name: Write build.env with APPS_JSON_BASE64 (restricted perms)
      ansible.builtin.copy:
        dest: "{{ build_env_path }}"
        content: "APPS_JSON_BASE64={{ apps_json_base64 }}\n"
        mode: "0600"

    - name: Check if image already exists
      ansible.builtin.command: docker images --quiet "{{ image_name }}"
      register: image_exists
      failed_when: false
      changed_when: false

    - name: Debug - image already exists
      ansible.builtin.debug:
        msg: "Image {{ image_name }} already exists (id={{ image_exists.stdout }})."
      when: image_exists.stdout | length > 0 and not force_build

    - name: Decode apps.json from base64 to temp file (required by Containerfile secret mount)
      ansible.builtin.shell: |
        echo "{{ apps_json_base64 }}" | base64 -d > "{{ build_dir }}/apps.json"
        chmod 600 "{{ build_dir }}/apps.json"
      args:
        executable: /bin/bash

    - name: Build Docker image (layered Containerfile)
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ frappe_docker_dir }}"

        echo "Starting Docker build at $(date)" >> "{{ build_log_path }}"
        echo "Image tag: {{ image_name }}" >> "{{ build_log_path }}"

        docker build \
          --no-cache \
          --build-arg=FRAPPE_PATH="{{ frappe_path | default(default_frappe_app) }}" \
          --build-arg=FRAPPE_BRANCH="{{ frappe_version }}" \
          --secret id=apps_json,src="{{ build_dir }}/apps.json" \
          --tag="{{ image_tag | default(image_name) }}" \
          --file=images/layered/Containerfile . 2>&1 | tee -a "{{ build_log_path }}"
      args:
        executable: /bin/bash
      register: docker_build_result
      failed_when: docker_build_result.rc != 0
      when: image_exists.stdout | length == 0 or force_build

    - name: Verify image exists after build
      ansible.builtin.command: docker images --quiet "{{ image_name }}"
      register: image_verification
      failed_when: image_verification.stdout == ""

    - name: Build recovery manifest payload
      ansible.builtin.set_fact:
        recovery_manifest_payload: >-
          {{
            (recovery_manifest | default({}))
            | combine({
                'manifest_version': (recovery_manifest.manifest_version | default(1)),
                'image_tag': (image_tag | default(image_name)),
                'image_name': image_name,
                'frappe_version': frappe_version,
                'apps_json_base64': apps_json_base64,
                'image_id': image_verification.stdout,
                'built_at': ansible_date_time.iso8601,
                'manifest_path': recovery_manifest_file
              }, recursive=True)
          }}

    - name: Persist recovery manifest on worker
      ansible.builtin.copy:
        dest: "{{ recovery_manifest_file }}"
        content: "{{ recovery_manifest_payload | to_nice_json }}\n"
        mode: "0600"

    - name: Optionally remove build.env and apps.json temp files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ build_env_path }}"
        - "{{ build_dir }}/apps.json"
      when: cleanup_tmp_files

    - name: Show build summary
      ansible.builtin.debug:
        msg: |
          ===== BUILD SUMMARY =====
          Image: {{ image_name }}
          Frappe branch: {{ frappe_version }}
          Build invoked: {{ (image_exists.stdout | length == 0) or force_build }}
          Build changed: {{ docker_build_result is defined and docker_build_result.rc == 0 }}
          Image ID: {{ image_verification.stdout }}
          Build log: {{ build_log_path }}
